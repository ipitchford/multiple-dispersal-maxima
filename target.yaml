  scaling: "Habitat measure 1, quadratic competition coefficient 1. M_(c*m)(d)=c*M_m(d/c)."
  basis_order: "Density variables theta_i; total biomass is sum p_i*theta_i."
  symmetries:
    - "Measure-preserving rearrangements of m leave M(d) unchanged."
    - "Simultaneous relabelling of resource values and probabilities."
    - "Finite density-to-abundance transformation x_i=p_i*theta_i."
