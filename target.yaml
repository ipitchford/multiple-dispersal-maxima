  url: "https://arxiv.org/abs/2108.01826"
  version: "2108.01826v1, 4 August 2021; full primary preprint inspected"
  novelty_status: "No matching arbitrary-N finite-Lp theorem found in the bounded search; important adjacent full texts remain unavailable."
