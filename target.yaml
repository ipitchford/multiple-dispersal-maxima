target_id: uniform-global-logistic-arbitrary-population-maxima
search_date: 2026-10-20
intended_contribution_unit: theorem
claim:
  exact_statement: |
    On (0,1), let theta solve d*(M-theta)+theta*(m-theta)=0,
    M=int_0^1 theta, with d>0 and m bounded away from zero.
    For every a>0 and every integer N>=1 there is a sequence of
    m_j in C-infinity([0,1]) with m_j>0, m_j'(x)>0, int m_j=a,
    and m_j -> a in every fixed finite Lp (1<=p<infinity), such
    that d -> M_(m_j)(d) has at least N distinct strict local maxima
    for every j. Before smoothing, N+1 resource levels suffice.
    There is an exact three-level resource with a nondegenerate
    minimum at d=3, M=1; every positive two-level resource is unimodal.
  exclusions:
    - Multiple maxima means distinct local maxima; equal-height global maxima are not asserted.
    - No L-infinity convergence to a constant is asserted.
    - No contrast bound independent of N is asserted.
    - No single positive bounded resource with infinitely many critical rates is asserted.
    - No claim that N+1 levels are necessary for N>2.
    - No claim about arbitrary mixing kernels or independent quadratic competition coefficients.
    - No novelty claim for the scalar quadratic formula, rank-one mixing, or resource concentration itself.
source:
