    expression: "g_r(d)=d*(t_r(d)-a)^2/(a*t_r(d)); t_r(d)=(r-d+sqrt((r-d)^2+4*a*d))/2"
    variables: [d, r, a]
    minimal_polynomial: "a*g^2+(d^2+(3*a-r)*d+a*r)*g-d*(r-a)^2=0"
    branch: "g(0)=0 and g(d)>0 for d>0, r>a>0"
    denominator_support: "The closed expression has denominator a*t; its primitive algebraic equation is polynomial."
    coefficient_recurrence: "r*t_n=-t_(n-1)-sum_(i=1)^(n-1)t_i*t_(n-i)+a*1_(n=1), t_0=r; g_n=t_n+t_(n-1)/a for n>=2"
